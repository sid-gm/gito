<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gito Extension</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: #faf9f6;
      color: #1a1a1a;
    }

    /* ── Header ── */
    .header {
      padding: 10px 12px;
      border-bottom: 1px solid #e8e4dc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      width: 20px; height: 20px;
      background: #1a1a1a;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      color: #faf9f6; font-weight: 700; font-size: 11px;
      flex-shrink: 0;
    }

    .company-switcher {
      flex: 1;
      position: relative;
    }

    .company-select {
      width: 100%;
      appearance: none;
      background: transparent;
      border: none;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      cursor: pointer;
      padding-right: 16px;
      outline: none;
    }

    .company-select:disabled { color: #888; cursor: default; }

    .company-caret {
      position: absolute; right: 0; top: 50%;
      transform: translateY(-50%);
      font-size: 9px; color: #888;
      pointer-events: none;
    }

    .btn-add-account {
      background: none; border: none; cursor: pointer;
      font-size: 16px; color: #888; line-height: 1;
      padding: 2px;
      flex-shrink: 0;
    }
    .btn-add-account:hover { color: #1a1a1a; }

    /* ── Content ── */
    .content { padding: 14px; }

    /* Setup form */
    .setup-label {
      font-size: 11px; font-weight: 500; color: #666;
      text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    input[type="url"], input[type="password"], input[type="text"] {
      width: 100%; padding: 7px 10px;
      border: 1px solid #d4cfc6; border-radius: 6px;
      font-size: 13px; background: #fff; color: #1a1a1a;
      margin-bottom: 10px; outline: none;
    }
    input:focus { border-color: #1a1a1a; }

    .help-text {
      font-size: 11px; color: #888;
      margin-top: -6px; margin-bottom: 12px; line-height: 1.5;
    }

    .error-msg { color: #dc2626; font-size: 12px; margin-bottom: 8px; }

    button.btn-primary {
      width: 100%; padding: 8px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      background: #1a1a1a; color: #faf9f6;
    }
    button.btn-primary:hover { background: #333; }
    button.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    button.btn-secondary {
      width: 100%; padding: 8px;
      background: transparent; border: 1px solid #d4cfc6;
      border-radius: 6px; font-size: 13px; font-weight: 500;
      color: #666; cursor: pointer;
    }
    button.btn-secondary:hover { border-color: #999; color: #333; }

    /* Configured state */
    .stats-box {
      text-align: center; padding: 12px;
      background: #fff; border: 1px solid #e8e4dc;
      border-radius: 6px; margin-bottom: 10px;
    }
    .stats-count { font-size: 28px; font-weight: 700; line-height: 1; margin-bottom: 2px; }
    .stats-label { font-size: 11px; color: #888; }

    .config-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; background: #fff;
      border: 1px solid #e8e4dc; border-radius: 6px; margin-bottom: 6px;
    }
    .config-label { font-size: 11px; color: #888; }
    .config-value { font-size: 12px; font-weight: 500; font-family: monospace; }

    .entities-section { margin-bottom: 10px; }
    .entities-label {
      font-size: 11px; font-weight: 500; color: #666;
      text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .entity-list {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .entity-chip {
      font-size: 11px; padding: 2px 8px;
      background: #fff; border: 1px solid #e8e4dc;
      border-radius: 20px; color: #444;
    }
    .entity-empty { font-size: 12px; color: #999; font-style: italic; }

    #state-setup, #state-configured { display: none; }

    /* ── Auto-collect section ── */
    .section-divider {
      display: flex; align-items: center; gap: 8px;
      margin: 14px 0 10px;
    }
    .section-divider::before, .section-divider::after {
      content: ""; flex: 1; height: 1px; background: #e8e4dc;
    }
    .section-title {
      font-size: 10px; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .platform-checks {
      display: flex; gap: 12px; margin-bottom: 10px;
    }
    .check-label {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; color: #333; cursor: pointer;
    }
    .check-label input[type="checkbox"] { cursor: pointer; accent-color: #1a1a1a; }

    .interval-select {
      width: 100%; padding: 7px 10px;
      border: 1px solid #d4cfc6; border-radius: 6px;
      font-size: 13px; background: #fff; color: #1a1a1a;
      margin-bottom: 10px; outline: none; cursor: pointer;
    }
    .interval-select:focus { border-color: #1a1a1a; }

    .toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .toggle-label { font-size: 12px; font-weight: 500; color: #333; }

    .toggle-switch {
      position: relative; display: inline-block;
      width: 36px; height: 20px; flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-knob {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #d4cfc6; border-radius: 20px; transition: .2s;
    }
    .toggle-knob::before {
      position: absolute; content: "";
      height: 14px; width: 14px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    .toggle-switch input:checked + .toggle-knob { background: #16a34a; }
    .toggle-switch input:checked + .toggle-knob::before { transform: translateX(16px); }

    .ac-status {
      font-size: 11px; color: #666; line-height: 1.5; margin-bottom: 4px;
    }
    .ac-error {
      font-size: 11px; color: #dc2626; line-height: 1.5;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 5px; padding: 6px 8px; margin-bottom: 4px;
      display: none;
    }

    .run-action-row {
      display: flex; gap: 6px; margin-bottom: 8px;
    }
    .btn-run-now {
      flex: 1; padding: 7px;
      background: transparent; border: 1px solid #d4cfc6;
      border-radius: 6px; font-size: 12px; font-weight: 500;
      color: #444; cursor: pointer; text-align: center;
    }
    .btn-run-now:hover:not(:disabled) { border-color: #1a1a1a; color: #1a1a1a; }
    .btn-run-now:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-view-runs {
      flex: 1; padding: 7px;
      background: transparent; border: 1px solid #d4cfc6;
      border-radius: 6px; font-size: 12px; font-weight: 500;
      color: #444; cursor: pointer; text-align: center;
      text-decoration: none; display: flex; align-items: center; justify-content: center;
    }
    .btn-view-runs:hover { border-color: #1a1a1a; color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">G</div>
    <div class="company-switcher">
      <select class="company-select" id="company-select" disabled>
        <option value="">Gito</option>
      </select>
      <span class="company-caret">▼</span>
    </div>
    <button class="btn-add-account" id="btn-add-account" title="Add another company">+</button>
  </div>

  <div class="content">
    <!-- Setup state -->
    <div id="state-setup">
      <p class="setup-label">Gito URL</p>
      <input type="url" id="input-url" placeholder="https://your-gito.vercel.app" />

      <p class="setup-label">API Key</p>
      <input type="password" id="input-key" placeholder="gito_••••••••••••••••" />
      <p class="help-text">Find your API key in Gito → Sources → Extension</p>

      <p class="error-msg" id="setup-error"></p>
      <button class="btn-primary" id="btn-save">Save & Connect</button>
    </div>

    <!-- Configured state -->
    <div id="state-configured">
      <div class="stats-box">
        <div class="stats-count" id="daily-count">0</div>
        <div class="stats-label">items sent today</div>
      </div>

      <div class="entities-section">
        <div class="entities-label">Tracked entities</div>
        <div class="entity-list" id="entity-list"></div>
      </div>

      <div class="section-divider">
        <span class="section-title">Auto-collect</span>
      </div>

      <p class="setup-label">Search terms</p>
      <input type="text" id="ac-terms" placeholder="lurie, daniel lurie, SF mayor" />

      <p class="setup-label">Platforms</p>
      <div class="platform-checks">
        <label class="check-label"><input type="checkbox" id="ac-x" /> X</label>
        <label class="check-label"><input type="checkbox" id="ac-threads" /> Threads</label>
      </div>

      <p class="setup-label">Interval</p>
      <select id="ac-interval" class="interval-select">
        <option value="30">Every 30 min</option>
        <option value="60" selected>Every hour</option>
        <option value="120">Every 2 hours</option>
        <option value="240">Every 4 hours</option>
      </select>

      <div class="toggle-row">
        <span class="toggle-label">Enable auto-collect</span>
        <label class="toggle-switch">
          <input type="checkbox" id="ac-enabled" />
          <span class="toggle-knob"></span>
        </label>
      </div>

      <div class="run-action-row">
        <button class="btn-run-now" id="btn-run-now">Run now</button>
        <a class="btn-view-runs" id="btn-view-runs" href="#" target="_blank">View runs ↗</a>
      </div>
      <div class="ac-status" id="ac-status"></div>
      <div class="ac-error" id="ac-error"></div>

      <button class="btn-secondary" id="btn-disconnect">Disconnect</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
