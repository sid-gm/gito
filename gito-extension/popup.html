<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gito Extension</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: #faf9f6;
      color: #1a1a1a;
    }

    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #e8e4dc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      width: 20px;
      height: 20px;
      background: #1a1a1a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #faf9f6;
      font-weight: 700;
      font-size: 11px;
    }

    .header-title {
      font-weight: 600;
      font-size: 14px;
    }

    .content { padding: 16px; }

    /* Setup state */
    .setup-label {
      font-size: 11px;
      font-weight: 500;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d4cfc6;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      color: #1a1a1a;
      margin-bottom: 10px;
      outline: none;
    }

    input:focus { border-color: #1a1a1a; }

    .help-text {
      font-size: 11px;
      color: #888;
      margin-top: -6px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary {
      background: #1a1a1a;
      color: #faf9f6;
    }

    .btn-primary:hover { background: #333; }

    .btn-secondary {
      background: transparent;
      border: 1px solid #d4cfc6;
      color: #666;
    }

    .btn-secondary:hover { border-color: #999; color: #333; }

    /* Configured state */
    .config-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #fff;
      border: 1px solid #e8e4dc;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .config-label { font-size: 11px; color: #888; }
    .config-value { font-size: 12px; font-weight: 500; font-family: monospace; }

    .stats-box {
      text-align: center;
      padding: 12px;
      background: #fff;
      border: 1px solid #e8e4dc;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .stats-count {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 2px;
    }

    .stats-label { font-size: 11px; color: #888; }

    .error-msg {
      color: #dc2626;
      font-size: 12px;
      margin-bottom: 8px;
    }

    #state-setup, #state-configured { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">G</div>
    <span class="header-title">Gito</span>
  </div>

  <div class="content">
    <!-- Setup state -->
    <div id="state-setup">
      <p class="setup-label">Gito URL</p>
      <input type="url" id="input-url" placeholder="https://your-gito.vercel.app" />

      <p class="setup-label">API Key</p>
      <input type="password" id="input-key" placeholder="gito_••••••••••••••••" />
      <p class="help-text">Find your API key in Gito → Sources → Extension</p>

      <p class="error-msg" id="setup-error"></p>
      <button class="btn-primary" id="btn-save">Save & Connect</button>
    </div>

    <!-- Configured state -->
    <div id="state-configured">
      <div class="stats-box">
        <div class="stats-count" id="daily-count">0</div>
        <div class="stats-label">items sent today</div>
      </div>

      <div class="config-row">
        <span class="config-label">Connected to</span>
        <span class="config-value" id="display-url"></span>
      </div>
      <div class="config-row" style="margin-bottom:12px">
        <span class="config-label">API key</span>
        <span class="config-value" id="display-key"></span>
      </div>

      <button class="btn-secondary" id="btn-disconnect">Disconnect</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
