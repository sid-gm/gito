<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gito Extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #4f7cff;
      --bg: #0f1115;
      --panel: #12151d;
      --panel-2: #161a23;
      --border: #20263a;
      --border-2: #262c3a;
      --row-border: #191d2a;
      --text: #e5e9f0;
      --text-2: #c3cad9;
      --muted: #8891a5;
      --dim: #7b8398;
      --faint: #5f6a80;
      --pos: #34d399;
      --warn: #f59e0b;
      --neg: #fb7185;
      --font-sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    body {
      width: 344px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
    }
    .mono { font-family: var(--font-mono); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 6px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border-bottom: 1px solid var(--row-border);
    }
    .header-logo {
      width: 26px; height: 26px; border-radius: 7px;
      background: var(--accent); color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-weight: 700; font-size: 15px;
      flex-shrink: 0;
    }
    .header-name { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
    .header-right { margin-left: auto; font-size: 11.5px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
    .header-right .mono { color: var(--text-2); }
    .offline-dot { width: 7px; height: 7px; border-radius: 50%; background: #4b5568; }

    .content { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    /* ── Setup ── */
    .setup-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    .field-label {
      font-family: var(--font-mono); font-size: 10.5px;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 6px;
    }
    input[type="url"], input[type="password"], input[type="text"] {
      width: 100%; padding: 9px 11px;
      background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 8px;
      color: var(--text); font-size: 13px; font-family: inherit; outline: none;
    }
    input[type="password"] { font-family: var(--font-mono); }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--faint); }
    .field-gap { margin-bottom: 14px; }
    .field-gap-lg { margin-bottom: 16px; }

    .error-msg { color: var(--neg); font-size: 12px; margin-bottom: 10px; display: none; }
    .error-msg.visible { display: block; }

    .btn-primary {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: var(--accent); color: var(--bg);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-primary:disabled { background: #1a2030; color: var(--dim); cursor: default; }

    /* ── Cards ── */
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
    .card-pad { padding: 14px; }
    .card-head {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 12px 14px 11px 14px; border-bottom: 1px solid var(--row-border);
    }
    .card-title { font-size: 12.5px; font-weight: 600; }
    .card-hint { font-size: 11px; color: var(--dim); }

    /* ── Blocked banner ── */
    .banner {
      display: none; gap: 9px; align-items: flex-start;
      padding: 11px 12px; background: #fb71850f;
      border: 1px solid #fb718533; border-radius: 10px;
    }
    .banner.visible { display: flex; }
    .banner-mark {
      width: 17px; height: 17px; flex: none; border-radius: 5px;
      background: var(--neg); color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; margin-top: 1px;
    }
    .banner-text { font-size: 11.5px; color: #f6b8c1; line-height: 1.5; }
    .banner-text strong { font-weight: 600; color: #fecdd4; }

    /* ── Run panel ── */
    .run-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .run-label {
      font-family: var(--font-mono); font-size: 10.5px;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 5px;
    }
    .run-status { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
    .run-status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pos); flex: none; }
    .run-status-meta { color: var(--dim); font-weight: 400; font-size: 12px; }
    .run-count { text-align: right; }
    .run-count-num { font-family: var(--font-mono); font-size: 20px; font-weight: 600; line-height: 1; }
    .run-count-label { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .btn-run { margin-top: 14px; }
    .btn-run.running { background: #1a2030; color: var(--dim); cursor: default; }

    /* ── Platform health ── */
    .plat-row {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
      padding: 11px 14px; border-bottom: 1px solid var(--row-border);
    }
    .plat-row:last-child { border-bottom: none; }
    .plat-row.blocked { background: #fb71850d; }
    .plat-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .plat-tag {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 26px; height: 22px; padding: 0 5px; border-radius: 6px;
      font-family: var(--font-mono); font-size: 11px; font-weight: 600; flex: none;
    }
    .plat-name { font-size: 13px; font-weight: 500; }
    .plat-detail {
      font-size: 11px; color: var(--dim); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .plat-status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; }
    .plat-status-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* ── Quick-add keyword ── */
    .kw-form { display: flex; gap: 7px; }
    .kw-form input { flex: 1; min-width: 0; padding: 8px 10px; font-size: 12.5px; }
    .btn-add {
      padding: 8px 13px; border: 1px solid var(--accent);
      background: #4f7cff1f; color: #c9d6ff;
      border-radius: 8px; font-family: inherit; font-size: 12.5px; font-weight: 600;
      cursor: pointer; flex: none;
    }
    .kw-chips { display: none; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
    .kw-chips.visible { display: flex; }
    .kw-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 6px 4px 10px; background: var(--panel-2);
      border: 1px solid var(--border-2); border-radius: 7px;
      font-size: 11.5px; color: var(--text-2);
    }
    .kw-chip button {
      width: 15px; height: 15px; border: none; border-radius: 4px;
      background: #242b3a; color: var(--muted);
      font-size: 12px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit;
    }

    /* ── Manage link ── */
    .manage-link {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 13px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); text-decoration: none;
    }
    .manage-icon { width: 16px; height: 16px; color: var(--accent); flex: none; }
    .manage-texts { flex: 1; }
    .manage-title { font-size: 12.5px; font-weight: 500; }
    .manage-sub { font-size: 11px; color: var(--dim); margin-top: 1px; }
    .manage-arrow { color: var(--dim); font-size: 15px; }

    /* ── Footer ── */
    .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 2px; }
    .footer-version { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }
    .btn-disconnect {
      border: none; background: none; color: var(--dim);
      font-family: inherit; font-size: 11.5px; cursor: pointer; padding: 2px;
    }
    .btn-disconnect:hover { color: var(--text-2); }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">g</div>
    <div class="header-name">gito</div>
    <span class="header-right" id="header-status">
      <span class="offline-dot"></span>Offline
    </span>
  </div>

  <!-- Setup state -->
  <div id="state-setup" class="content" style="display:none">
    <div>
      <div class="setup-title">Connect to Gito</div>
      <div class="field-label">Gito URL</div>
      <input type="url" id="input-url" placeholder="https://usegito.com" class="field-gap" />
      <div class="field-label">API key</div>
      <input type="password" id="input-key" placeholder="gito_••••••••••••••••" class="field-gap-lg" />
      <div class="error-msg" id="setup-error"></div>
      <button class="btn-primary" id="btn-save">Save &amp; connect</button>
    </div>
  </div>

  <!-- Connected state -->
  <div id="state-configured" class="content" style="display:none">

    <div class="banner" id="blocked-banner">
      <span class="banner-mark">!</span>
      <div class="banner-text" id="blocked-text"></div>
    </div>

    <div class="card card-pad">
      <div class="run-top">
        <div>
          <div class="run-label">Status</div>
          <div class="run-status">
            <span class="run-status-dot" id="status-dot"></span>
            <span id="status-text">—</span>
            <span class="run-status-meta" id="status-meta"></span>
          </div>
        </div>
        <div class="run-count">
          <div class="run-count-num" id="items-today">0</div>
          <div class="run-count-label">items</div>
        </div>
      </div>
      <button class="btn-primary btn-run" id="btn-run-now">Run now</button>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">Platform health</span>
        <span class="card-hint" id="health-hint">last run · —</span>
      </div>
      <div id="platform-rows"></div>
    </div>

    <div class="card card-pad">
      <div class="card-head" style="padding:0;border:none;margin-bottom:9px">
        <span class="card-title">Quick-add keyword</span>
        <span class="card-hint" style="font-size:10.5px">→ collector terms</span>
      </div>
      <div class="kw-form">
        <input type="text" id="kw-input" placeholder="e.g. streamer university" />
        <button class="btn-add" id="btn-add-kw">Add</button>
      </div>
      <div class="kw-chips" id="kw-chips"></div>
    </div>

    <a class="manage-link" id="manage-link" href="https://usegito.com/analyst/sources" target="_blank">
      <span class="manage-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
      </span>
      <span class="manage-texts">
        <span class="manage-title" style="display:block">Manage configuration</span>
        <span class="manage-sub" style="display:block">Keywords, subreddits, schedule</span>
      </span>
      <span class="manage-arrow">→</span>
    </a>

    <div class="footer">
      <span class="footer-version" id="footer-version">v— · Chrome</span>
      <button class="btn-disconnect" id="btn-disconnect">Disconnect</button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
